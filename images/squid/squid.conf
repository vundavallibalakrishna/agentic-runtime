# %LOGIN is unset until a basic-auth scheme exists. The auth helper rewrites
# sbx-<sandbox_id>:<token> into the login the external ACL helper parses.
visible_hostname ar-squid
http_port 3128

auth_param basic program /usr/local/bin/ar-egress-auth
auth_param basic children 1 startup=1 idle=1
auth_param basic realm sandbox
auth_param basic credentialsttl 1 hour

acl SSL_ports port 443
acl CONNECT method CONNECT
external_acl_type ar_egress ttl=60 children-max=5 children-startup=1 %LOGIN %note{user} %DST /usr/local/bin/ar-egress-helper
acl egress_ok external ar_egress

http_access deny CONNECT !SSL_ports
http_access allow CONNECT egress_ok
http_access deny all

access_log stdio:/dev/stdout
cache_log stdio:/dev/stderr
pid_filename none
cache deny all
logfile_rotate 0
