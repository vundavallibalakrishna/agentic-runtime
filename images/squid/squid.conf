http_port 3128
acl SSL_ports port 443
acl CONNECT method CONNECT
external_acl_type ar_egress ttl=60 children-max=2 %LOGIN %DST /usr/local/bin/ar-egress-helper
acl egress_ok external ar_egress
http_access deny CONNECT !SSL_ports
http_access allow CONNECT egress_ok
http_access deny all
access_log stdio:/dev/stdout
cache_log /dev/stderr
pid_filename none
cache deny all
