# Computers: agents that run code, a shell or a browser in their own container.
# Adds the sandbox manager, which starts those containers, and the proxy that is their
# only way out. Without this file a tool that needs a computer is refused in words.
# Build the computer's image first: docker build -f images/sandbox/Dockerfile -t ar-sandbox:dev .
x-env: &env
  AR_SANDBOX_DRIVER: docker
  AR_SANDBOX_MANAGER_URL: http://sandbox-manager:${AR_SANDBOX_MANAGER_HOST_PORT:-8003}
  AR_SANDBOX_DOCKER_NETWORK: agentic-runtime_sandbox
  AR_SANDBOX_EGRESS_PROXY: http://squid:3128
  AR_SANDBOX_IMAGE: ${AR_SANDBOX_IMAGE:-ar-sandbox:dev}

services:
  sandbox-manager:
    profiles: [production]
    environment:
      <<: *env
  squid:
    profiles: [production]
  api:
    environment:
      <<: *env
  mcp-gateway:
    environment:
      <<: *env
  runtime-worker:
    environment:
      <<: *env
  system-worker:
    environment:
      <<: *env
  ingest-worker:
    environment:
      <<: *env
