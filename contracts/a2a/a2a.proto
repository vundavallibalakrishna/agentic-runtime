syntax = "proto3";

package a2a.v1;

// A2A methods the JSON-RPC surface already serves. The server maps each RPC
// onto that surface. Field names are the JSON names the tasks already use.

service A2AService {
  rpc SendMessage(SendMessageRequest) returns (Task);
  rpc SendStreamingMessage(SendMessageRequest) returns (stream StreamResponse);
  rpc GetTask(GetTaskRequest) returns (Task);
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse);
  rpc CancelTask(GetTaskRequest) returns (Task);
  rpc TaskSubscription(GetTaskRequest) returns (stream StreamResponse);
  rpc ResubscribeToTask(GetTaskRequest) returns (stream StreamResponse);
}

message SendMessageRequest {
  string tenant_id = 1;
  string text = 2;
  string context_id = 3;
}

message GetTaskRequest {
  string tenant_id = 1;
  string id = 2;
  string last_event_id = 3;
}

message ListTasksRequest {
  string tenant_id = 1;
  int32 page_size = 2;
}

message Task {
  string id = 1;
  string tenant_id = 2;
  string state = 3;
  string text = 4;
  bool resubscribed = 5;
}

message ListTasksResponse {
  repeated Task tasks = 1;
}

message StreamResponse {
  string kind = 1;
  Task task = 2;
}
