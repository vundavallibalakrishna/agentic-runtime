pre-commit:
  commands:
    ruff-format:
      glob: "*.py"
      run: uv run ruff format --force-exclude {staged_files}
    ruff-check:
      glob: "*.py"
      run: uv run ruff check --fix --force-exclude {staged_files}
    biome:
      glob: "*.{ts,tsx,js,jsx,json,css}"
      run: pnpm exec biome check --write --no-errors-on-unmatched {staged_files}
