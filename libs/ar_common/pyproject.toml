[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project]
name = "ar-common"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "structlog==26.1.0",
    "httpx==0.28.1",
    "redis==8.1.0",
    "tenacity==9.2.1",
    "orjson==3.13.0",
    "rfc8785==0.1.4",
    "pyjwt[crypto]==2.15.1",
    "cryptography==48.0.1",
    "opentelemetry-sdk==1.45.1",
    "opentelemetry-exporter-otlp==1.45.1",
    "opentelemetry-instrumentation-fastapi==0.66b1",
    "opentelemetry-instrumentation-httpx==0.66b1",
    "opentelemetry-instrumentation-sqlalchemy==0.66b1",
    "opentelemetry-instrumentation-asyncpg==0.66b1",
    "opentelemetry-instrumentation-redis==0.66b1",
    "prometheus-client==0.26.0",
    "boto3==1.43.106",
    "aiobotocore==3.9.2",
    "fastapi==0.151.0",
    "starlette==1.9.0",
    "uvicorn[standard]==0.54.0",
    "granian==2.8.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ar_common"]

[tool.deptry]
known_first_party = ["ar_common", "ar_contracts", "ar_domain", "ar_connector_sdk", "ar_client", "ar_testing", "ar_api", "ar_runtime", "ar_system", "ar_ingest", "ar_model_gateway", "ar_mcp_gateway", "ar_sandbox_manager", "ar_sandbox_agent", "ar_channels", "ar_mcp_sql", "ar_mcp_openapi", "ar_fake_llm"]

[tool.deptry.package_module_name_map]
ar-common = "ar_common"
ar-contracts = "ar_contracts"
ar-domain = "ar_domain"
ar-connector-sdk = "ar_connector_sdk"
ar-client = "ar_client"
ar-testing = "ar_testing"
ar-api = "ar_api"
ar-runtime = "ar_runtime"
ar-system = "ar_system"
ar-ingest = "ar_ingest"
ar-model-gateway = "ar_model_gateway"
ar-mcp-gateway = "ar_mcp_gateway"
ar-sandbox-manager = "ar_sandbox_manager"
ar-sandbox-agent = "ar_sandbox_agent"
ar-channels = "ar_channels"
ar-mcp-sql = "ar_mcp_sql"
ar-mcp-openapi = "ar_mcp_openapi"
ar-fake-llm = "ar_fake_llm"

[tool.deptry.per_rule_ignores]
DEP003 = ['botocore']
