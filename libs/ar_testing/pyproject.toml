[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project]
name = "ar-testing"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "ar-common",
    "fastapi==0.151.0",
    "httpx==0.28.1",
    "pydantic==2.14.1",
    "testcontainers==4.15.0",
    "polyfactory==3.3.0",
    "temporalio==1.34.0",
    "pytest==9.1.1",
    "uvicorn[standard]==0.54.0",
    "pyyaml==6.0.3",
    "orjson==3.13.0",
    "openai==3.35.1",
]

[tool.uv.sources]
ar-common = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/ar_testing"]

[tool.deptry]
known_first_party = ["ar_common", "ar_contracts", "ar_domain", "ar_connector_sdk", "ar_client", "ar_testing", "ar_api", "ar_runtime", "ar_system", "ar_ingest", "ar_model_gateway", "ar_mcp_gateway", "ar_sandbox_manager", "ar_sandbox_agent", "ar_channels"]

[tool.deptry.package_module_name_map]
ar-common = "ar_common"
ar-contracts = "ar_contracts"
ar-domain = "ar_domain"
ar-connector-sdk = "ar_connector_sdk"
ar-client = "ar_client"
ar-testing = "ar_testing"
ar-api = "ar_api"
ar-runtime = "ar_runtime"
ar-system = "ar_system"
ar-ingest = "ar_ingest"
ar-model-gateway = "ar_model_gateway"
ar-mcp-gateway = "ar_mcp_gateway"
ar-sandbox-manager = "ar_sandbox_manager"
ar-sandbox-agent = "ar_sandbox_agent"
ar-channels = "ar_channels"

[tool.deptry.per_rule_ignores]
DEP002 = ['openai']
