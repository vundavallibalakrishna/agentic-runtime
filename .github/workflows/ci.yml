name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Conventional commit title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "$TITLE" | grep -Eq '^(feat|fix|chore|docs|test|refactor|perf|build|ci|revert)(\([^)]+\))?: .+'

  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.3"
          enable-cache: true
      - run: uv python install 3.14.8
      - run: uv sync --all-packages --all-groups --all-extras --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run lint-imports
      - run: make deptry

  python-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.3"
          enable-cache: true
      - run: uv python install 3.14.8
      - run: uv sync --all-packages --all-groups --frozen
      - run: uv run pytest -m "not integration and not e2e" -q --cov

  python-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.3"
          enable-cache: true
      - run: uv python install 3.14.8
      - run: uv sync --all-packages --all-groups --all-extras --frozen
      - run: uv run pytest -m integration -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome check .
      - run: pnpm exec turbo run typecheck
      - run: pnpm exec turbo run test
      - run: pnpm exec knip
      - run: pnpm --filter @ar/web build

  web-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.3"
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: uv python install 3.14.8
      - run: uv sync --all-packages --all-groups --frozen
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ar/web exec playwright install --with-deps chromium
      - run: pnpm --filter @ar/web exec playwright test
        env:
          E2E_SCREENSHOT_DIR: /tmp/e2e-screenshots

  codegen-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.3"
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: uv python install 3.14.8
      - run: uv sync --all-packages --all-groups --frozen
      - run: pnpm install --frozen-lockfile
      - run: make gen
      - run: git diff --exit-code

  opa-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OPA
        run: |
          curl -fsSL -o /usr/local/bin/opa "https://github.com/open-policy-agent/opa/releases/download/v1.21.3/opa_linux_amd64_static"
          chmod +x /usr/local/bin/opa
      - run: opa fmt --diff policies/
      - run: opa check --strict policies/
      - run: opa test policies/ --coverage

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-trixie
        env:
          POSTGRES_USER: ar_owner
          POSTGRES_PASSWORD: ar_owner
          POSTGRES_DB: agentic_runtime
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ar_owner -d agentic_runtime"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.3"
          enable-cache: true
      - run: uv python install 3.14.8
      - run: uv sync --all-packages --all-groups --frozen
      - name: Upgrade, single head, model check, round trip
        env:
          AR_DATABASE_URL: postgresql+asyncpg://ar_owner:ar_owner@localhost:5432/agentic_runtime
        run: |
          uv run alembic -c libs/ar_domain/alembic.ini upgrade head
          test "$(uv run alembic -c libs/ar_domain/alembic.ini heads | wc -l)" -eq 1
          uv run alembic -c libs/ar_domain/alembic.ini check
          uv run alembic -c libs/ar_domain/alembic.ini downgrade base
          uv run alembic -c libs/ar_domain/alembic.ini upgrade head

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.3"
      - run: uv python install 3.14.8
      - run: uv sync --all-packages --all-groups --frozen
      - run: docker compose --profile deps --profile apps up -d --build
      - run: uv run python scripts/smoke.py --health-only
      - name: Compose logs
        if: failure()
        run: docker compose --profile deps --profile apps logs --no-color --tail 100

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.3"
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: uv python install 3.14.8
      - run: uv sync --all-packages --all-groups --frozen
      - run: pnpm install --frozen-lockfile
      - run: uv run python scripts/check_docs_links.py
      - run: uv run python scripts/check_env_catalogue.py
      - run: uv run python scripts/check_audit_catalogue.py
      - run: uv run python scripts/check_stack_pins.py
      - run: uv run python scripts/check_public_camel_case.py
      - name: no placeholder markers
        run: |
          if grep -RInE --exclude-dir=node_modules --exclude-dir=.venv --exclude-dir=.git --exclude-dir=.next --exclude-dir=.turbo 'TO''DO|FIX''ME' .; then
            echo "placeholder markers are not allowed; record the item in docs/open-questions.md"
            exit 1
          fi

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v4.3.1
      - run: helm lint deploy/helm/agentic-runtime
      - run: helm template agentic-runtime deploy/helm/agentic-runtime

  fresh-clone:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.3"
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: uv python install 3.14.8
      - name: Bootstrap
        run: make bootstrap
      - name: Occupy the default host ports
        run: |
          uv run python scripts/hold_ports.py > /tmp/hold-ports.log 2>&1 &
          sleep 1
          grep -E "holding|already taken" /tmp/hold-ports.log
      - name: Move busy ports
        run: make ports-check AUTO_PORTS=1
      - name: Start dependencies and seed
        run: |
          make up
          make migrate
          make seed
      - name: Owned containers do not shift ports again
        run: |
          cp .env /tmp/env-after-up
          make ports-check AUTO_PORTS=1
          diff -q .env /tmp/env-after-up
      - name: Start the app processes
        run: |
          set -a
          # shellcheck disable=SC1091
          . ./.env
          set +a
          uv run honcho start -f Procfile.dev > /tmp/honcho.log 2>&1 &
          echo $! > /tmp/honcho.pid
      - name: Health and login smoke
        run: FRESH_CLONE_EXPECT_SHIFTED=1 uv run python scripts/fresh_clone_smoke.py
      - name: Logs
        if: always()
        run: |
          echo "----- hold -----"
          cat /tmp/hold-ports.log || true
          echo "----- honcho -----"
          tail -n 200 /tmp/honcho.log || true
          docker compose -f compose.yaml logs --no-color --tail 80 keycloak || true
      - name: Stop
        if: always()
        run: |
          if [ -f /tmp/honcho.pid ]; then kill "$(cat /tmp/honcho.pid)" || true; fi
          make down

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_VERSION: 8.30.1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.3"
      - run: uv tool install pip-audit==2.10.1
      - run: uv tool run pip-audit --vulnerability-service osv
