name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*.*.*"]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@v4
        with:
          version: v4.3.1
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.3"
      - run: uv python install 3.14.8
      - run: uv sync --all-packages --all-groups --frozen
      - name: Dry run on manual dispatch
        if: github.event_name == 'workflow_dispatch'
        run: uv run python scripts/release.py --dry-run
      - name: Package chart
        if: github.event_name != 'workflow_dispatch'
        run: uv run python scripts/release.py --bundle --destination dist
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'workflow_dispatch'
        with:
          name: agentic-runtime-chart
          path: dist/*
