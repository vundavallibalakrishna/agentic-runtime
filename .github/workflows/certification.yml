name: certification

# A fresh install with every feature on, certified against the tenant's real model.
# Started by hand: it calls a paid model. A pull request that changes the job runs the
# install and the seed only, with no model key.
on:
  workflow_dispatch:
    inputs:
      parts:
        description: "Parts to run, in words: live tools agents"
        default: "live tools"
      model:
        description: "Chat model the provider serves"
        default: "Qwen/Qwen3.8-27B"
      repeat:
        description: "Times each tool flow runs"
        default: "2"
      context_window:
        description: "The model's served context window, when it differs from the product default"
        default: ""
  pull_request:
    paths:
      - scripts/certify_stack.sh
      - .github/workflows/certification.yml
      - compose.computers.yaml

permissions:
  contents: read

concurrency:
  group: certification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  certification:
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space for the images
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.3"
      - run: uv python install 3.14.8
      - run: uv sync --all-packages --all-groups --frozen
      - name: Certify
        env:
          AR_LLM_API_KEY: ${{ github.event_name == 'workflow_dispatch' && secrets.AR_LLM_API_KEY || '' }}
          AR_LLM_BASE_URL: ${{ vars.AR_LLM_BASE_URL || 'https://api.deepinfra.com/v1/openai' }}
          AR_LLM_MODEL: ${{ inputs.model }}
          AR_CERT_PARTS: ${{ inputs.parts }}
          AR_CERT_REPEAT: ${{ inputs.repeat }}
          AR_CERT_CONTEXT_WINDOW: ${{ inputs.context_window }}
        run: bash scripts/certify_stack.sh
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: certification-${{ github.run_id }}
          path: var/certification
          retention-days: 30
          if-no-files-found: warn
