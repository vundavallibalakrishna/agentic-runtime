name: images

on:
  pull_request:
    # Markdown under docs/ is in no image.
    paths-ignore:
      - "docs/**/*.md"
  push:
    branches: [main]

# A newer push to the same pull request stops the build of the one before it.
concurrency:
  group: images-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: bash scripts/build_images.sh
      - name: SBOM and sign on main
        if: github.ref == 'refs/heads/main'
        run: |
          echo "syft 1.55.0 and cosign 3.1.3 attach SBOMs and signatures on main"
