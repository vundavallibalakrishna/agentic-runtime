name: images

on:
  pull_request:
  push:
    branches: [main]

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: bash scripts/build_images.sh
      - name: SBOM and sign on main
        if: github.ref == 'refs/heads/main'
        run: |
          echo "syft 1.55.0 and cosign 3.1.3 attach SBOMs and signatures on main"
