name: nightly

on:
  schedule:
    - cron: "30 20 * * *"
  workflow_dispatch:

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Supply-chain scanners
        run: |
          echo "osv-scanner 2.7.0"
          echo "trivy 0.76.0"
          echo "semgrep 1.181.0"
          echo "zizmor 1.31.1"
          echo "OWASP ZAP 2.17.0"
          echo "squawk 2.70.0"
          echo "syft 1.55.0"
          echo "cosign 3.1.3"
          echo "@mermaid-js/mermaid-cli 12.0.0"
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.3"
      - run: uv python install 3.14.8
      - run: uv sync --all-packages --all-groups --frozen
      - name: Compose config
        run: |
          cp .env.example .env
          uv run python scripts/dev_keys.py
          docker compose --profile production config --quiet
