# OPA cannot sign X-AR-Internal. It polls the forwarder in this container, which
# signs the request and sends it to the API. Decisions fail closed until the
# bundle arrives.
services:
  ar:
    url: ${AR_OPA_FORWARD_URL}
bundles:
  ar:
    service: ar
    resource: /internal/v1/opa/bundles/ar.tar.gz
    polling:
      min_delay_seconds: 5
      max_delay_seconds: 15
    persist: false
