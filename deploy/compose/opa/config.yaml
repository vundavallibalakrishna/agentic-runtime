# Compose supports a host-run API as well as its published container port.
# Decisions fail closed until the authenticated tenant bundle is available.
services:
  ar:
    url: "http://host.docker.internal:${AR_PORT}"
    credentials:
      bearer:
        token: "${AR_OPA_BUNDLE_TOKEN}"
bundles:
  ar:
    service: ar
    resource: /internal/v1/opa/bundles/ar.tar.gz
    polling:
      min_delay_seconds: 5
      max_delay_seconds: 15
    persist: false
