# OPA polls the API on the install network. The bearer token is
# AR_OPA_BUNDLE_TOKEN. Decisions fail closed until the bundle arrives.
services:
  ar:
    url: http://api:${AR_PORT}
    credentials:
      bearer:
        token: ${AR_OPA_BUNDLE_TOKEN}
        scheme: Bearer
bundles:
  ar:
    service: ar
    resource: /internal/v1/opa/bundles/ar.tar.gz
    polling:
      min_delay_seconds: 5
      max_delay_seconds: 15
    persist: false
