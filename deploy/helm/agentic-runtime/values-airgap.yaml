# Air-gapped overlay. Combine with values-small.yaml.
global:
  imageRegistry: registry.example.internal/ar
cluster:
  # Addresses the CNI enforces for the API. Include the service CIDR and the
  # control-plane endpoint IPs. A service CIDR alone is dropped when the CNI
  # evaluates the node address after DNAT.
  apiServerCidrs:
    - 10.96.0.0/12
airgap:
  lockdown: true
  isolatePlatformDb: true
# lockdown also sets AR_EGRESS_CLOSED=true and AR_EGRESS_HOSTS=otel-collector,
# and drops the chart's extra port 443 rules. Add in-cluster model hosts to
# AR_EGRESS_HOSTS or the tenant allowlist before pointing a provider at them.
sandboxes:
  driver: kubernetes
egress:
  packageMirrors:
    pypi: http://pypi.internal/simple
    npm: http://npm.internal
    apt: http://apt.internal
