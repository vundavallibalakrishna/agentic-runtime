{{- if .Values.gateway.enabled }}
{{- if .Values.gateway.create }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.gateway.issuer | quote }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: {{ .Values.gateway.hostname }}
      tls:
        mode: Terminate
        certificateRefs:
          - name: {{ .Release.Name }}-tls
    - name: http
      protocol: HTTP
      port: 80
      hostname: {{ .Values.gateway.hostname }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Release.Name }}-tls
spec:
  secretName: {{ .Release.Name }}-tls
  issuerRef:
    kind: ClusterIssuer
    name: {{ .Values.gateway.issuer }}
  dnsNames:
    - {{ .Values.gateway.hostname }}
{{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace | default .Release.Namespace }}
      sectionName: https
  hostnames:
    - {{ .Values.gateway.hostname }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/
      backendRefs:
        - name: {{ .Release.Name }}-api
          port: 8000
    - matches:
        - path:
            type: PathPrefix
            value: /scim/v2/
      backendRefs:
        - name: {{ .Release.Name }}-api
          port: 8000
    - matches:
        - path:
            type: PathPrefix
            value: /channels/
      backendRefs:
        - name: {{ .Release.Name }}-channels
          port: 8004
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ .Release.Name }}-web
          port: 3000
{{- end }}
