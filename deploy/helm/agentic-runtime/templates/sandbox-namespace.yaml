apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.sandboxes.namespace }}
  labels:
    ar.io/purpose: sandboxes
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: {{ .Release.Name }}-sandboxes
  namespace: {{ .Values.sandboxes.namespace }}
spec:
  hard:
    pods: {{ .Values.sandboxes.quota.pods | quote }}
    requests.cpu: {{ .Values.sandboxes.quota.cpu | quote }}
    requests.memory: {{ .Values.sandboxes.quota.memory | quote }}
---
apiVersion: v1
kind: LimitRange
metadata:
  name: {{ .Release.Name }}-sandboxes
  namespace: {{ .Values.sandboxes.namespace }}
spec:
  limits:
    - type: Container
      default:
        cpu: "1"
        memory: 1Gi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
{{- if .Values.sandboxes.falco }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Release.Name }}-falco
  namespace: {{ .Values.sandboxes.namespace }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: falco
  template:
    metadata:
      labels:
        app.kubernetes.io/name: falco
    spec:
      hostPID: true
      hostNetwork: true
      tolerations:
        - key: ar.io/sandbox
          operator: Exists
      nodeSelector:
        {{- toYaml .Values.sandboxes.nodeSelector | nindent 8 }}
      containers:
        - name: falco
          image: falcosecurity/falco:0.45.1
          securityContext:
            privileged: true
          volumeMounts:
            - name: proc
              mountPath: /host/proc
              readOnly: true
      volumes:
        - name: proc
          hostPath:
            path: /proc
{{- end }}
