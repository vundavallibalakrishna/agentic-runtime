{{- if .Values.secrets.create }}
{{- $data := deepCopy .Values.secrets.data }}
{{- if .Values.postgres.bundled }}
{{- $host := printf "%s-pg-pooler" .Release.Name }}
{{- if eq .Values.postgres.mode "statefulset" }}
{{- $host = printf "%s-postgres" .Release.Name }}
{{- end }}
{{- $_ := set $data "AR_DATABASE_URL" (printf "postgresql+asyncpg://%s:%s@%s:5432/ar" .Values.postgres.username .Values.postgres.password $host) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
{{- range $key, $value := $data }}
  {{ $key }}: {{ $value | toString | quote }}
{{- end }}
{{- end }}
