{{- if .Values.secrets.create }}
{{- $data := deepCopy .Values.secrets.data }}
{{- if .Values.postgres.bundled }}
{{- $host := printf "%s-pg-pooler" .Release.Name }}
{{- if eq .Values.postgres.mode "statefulset" }}
{{- $host = printf "%s-postgres" .Release.Name }}
{{- $_ := set $data "POSTGRES_PASSWORD" .Values.postgres.superuserPassword }}
{{- end }}
{{- $_ := set $data "AR_DATABASE_URL" (printf "postgresql+asyncpg://%s:%s@%s:5432/ar" .Values.postgres.username (index .Values.secrets.data "AR_DB_APP_PASSWORD" | urlquery) $host) }}
{{- end }}
{{/*
  Two Secrets, same bytes. Pre-upgrade jobs run before Helm updates release
  resources, so reconcile-roles and migrate read <release>-secrets-hook
  (weight -20). hook-succeeded deletes that copy. The release Secret below
  keeps the name pods already mount. A different name is required: a hook
  cannot adopt the release object. --no-hooks installs only the release
  Secret, so kind applies the hook Secret before the migrate Job.
*/}}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
{{- range $key, $value := $data }}
  {{ $key }}: {{ $value | toString | quote }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets-hook
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
type: Opaque
stringData:
{{- range $key, $value := $data }}
  {{ $key }}: {{ $value | toString | quote }}
{{- end }}
{{- end }}
