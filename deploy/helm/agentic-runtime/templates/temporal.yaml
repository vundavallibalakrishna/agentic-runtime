{{- if .Values.temporal.bundled }}
{{- $shards := .Values.temporal.numHistoryShards | int }}
{{- if lt $shards 1 }}
{{- fail "temporal.numHistoryShards must be a positive integer. It is fixed for the life of the cluster." }}
{{- end }}
{{- end }}
{{- define "ar.temporalEnv" -}}
- name: DB
  value: postgres12
- name: DB_PORT
  value: {{ include "ar.temporalDbPort" . | trim | quote }}
- name: POSTGRES_SEEDS
  value: {{ include "ar.temporalDbSeed" . | trim | quote }}
- name: POSTGRES_USER
  value: ar_temporal
- name: POSTGRES_PWD
  valueFrom:
    secretKeyRef:
      name: {{ include "ar.installSecret" . }}
      key: AR_DB_TEMPORAL_PASSWORD
- name: DBNAME
  value: temporal
- name: VISIBILITY_DBNAME
  value: temporal_visibility
- name: NUM_HISTORY_SHARDS
  value: {{ .Values.temporal.numHistoryShards | quote }}
- name: BIND_ON_IP
  value: "0.0.0.0"
- name: SERVICES
  value: frontend,history,matching,worker
- name: TEMPORAL_ADDRESS
  value: {{ printf "%s-temporal:7233" .Release.Name | quote }}
- name: TEMPORAL_NAMESPACE
  value: {{ .Values.temporal.namespace | quote }}
{{- end }}
{{- if .Values.temporal.bundled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-temporal
  labels:
    app.kubernetes.io/name: temporal
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: temporal
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: temporal-schema
          image: {{ include "ar.thirdPartyImage" (list . .Values.temporal.adminImage.repository .Values.temporal.adminImage.tag) }}
          command: ["/bin/sh", "/etc/temporal/scripts/schema.sh"]
          env:
            {{- include "ar.temporalEnv" . | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: scripts
              mountPath: /etc/temporal/scripts
            - name: tmp
              mountPath: /tmp
      containers:
        - name: temporal
          image: {{ include "ar.thirdPartyImage" (list . .Values.temporal.image.repository .Values.temporal.image.tag) }}
          command: ["/bin/bash", "/etc/temporal/scripts/start.sh"]
          ports:
            - name: rpc
              containerPort: 7233
          env:
            {{- include "ar.temporalEnv" . | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: rpc
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: rpc
            initialDelaySeconds: 30
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: scripts
              mountPath: /etc/temporal/scripts
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
        - name: scripts
          configMap:
            name: {{ .Release.Name }}-temporal-scripts
            defaultMode: 0555
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-temporal
  labels:
    app.kubernetes.io/name: temporal
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    app.kubernetes.io/name: temporal
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: grpc
      port: 7233
      targetPort: rpc
{{- end }}
