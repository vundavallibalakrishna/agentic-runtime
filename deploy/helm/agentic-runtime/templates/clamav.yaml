{{- if .Values.clamav.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-clamav
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: clamav
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clamav
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: clamav
          image: {{ include "ar.thirdPartyImage" (list . .Values.clamav.image.repository .Values.clamav.image.tag) }}
          ports:
            - containerPort: 3310
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-clamav
spec:
  selector:
    app.kubernetes.io/name: clamav
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - port: 3310
      targetPort: 3310
{{- end }}
