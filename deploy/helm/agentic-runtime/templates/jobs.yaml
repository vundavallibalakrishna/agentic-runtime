apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: {{ include "ar.thirdPartyImage" (list . "ar-migrate" .Values.global.imageTag) }}
          command: ["alembic", "-c", "/app/libs/ar_domain/alembic.ini", "upgrade", "head"]
          env:
            - name: AR_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret | default (printf "%s-secrets" .Release.Name) }}
                  key: AR_DATABASE_URL
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- if eq .Values.global.deploymentMode "single_tenant" }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-bootstrap
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: {{ include "ar.thirdPartyImage" (list . "ar-migrate" .Values.global.imageTag) }}
          command: ["python", "-m", "ar_domain.bootstrap"]
          env:
            - name: AR_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret | default (printf "%s-secrets" .Release.Name) }}
                  key: AR_DATABASE_URL
                  optional: true
            - name: AR_BOOTSTRAP_TENANT_SLUG
              value: {{ .Values.bootstrap.tenantSlug | quote }}
            - name: AR_BOOTSTRAP_TENANT_NAME
              value: {{ .Values.bootstrap.tenantName | quote }}
            - name: AR_BOOTSTRAP_ADMIN_EMAIL
              value: {{ .Values.bootstrap.adminEmail | quote }}
            - name: AR_DEPLOYMENT_MODE
              value: {{ .Values.global.deploymentMode | quote }}
            - name: AR_ENV
              value: {{ .Values.global.env | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
