{{- if and .Values.postgres.bundled (eq .Values.postgres.mode "statefulset") .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-pg-superuser
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
type: kubernetes.io/basic-auth
stringData:
  username: postgres
  password: {{ .Values.postgres.superuserPassword | quote }}
{{- end }}
{{- if and .Values.postgres.bundled (eq .Values.postgres.mode "cnpg") .Values.secrets.create }}
{{- range $role, $key := dict "ar_owner" "AR_DB_OWNER_PASSWORD" "ar_platform" "AR_DB_PLATFORM_PASSWORD" "ar_app" "AR_DB_APP_PASSWORD" "ar_readonly" "AR_DB_READONLY_PASSWORD" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ar.roleSecret" (list $ $role) }}
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: {{ $.Release.Name }}
type: kubernetes.io/basic-auth
stringData:
  username: {{ $role | quote }}
  password: {{ index $.Values.secrets.data $key | quote }}
{{- end }}
{{- end }}
{{- if and .Values.postgres.bundled (eq .Values.postgres.mode "cnpg") }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Release.Name }}-pg
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  instances: {{ .Values.postgres.instances }}
  imageName: {{ include "ar.thirdPartyImage" (list . .Values.postgres.image.repository .Values.postgres.image.tag) }}
  enableSuperuserAccess: true
  postgresql:
    parameters:
      archive_timeout: "300"
      shared_buffers: "256MB"
  bootstrap:
    initdb:
      database: ar
      owner: ar_owner
      secret:
        name: {{ include "ar.roleSecret" (list . "ar_owner") }}
      postInitSQL:
        - CREATE ROLE ar_platform LOGIN NOSUPERUSER BYPASSRLS
        - CREATE ROLE ar_app LOGIN NOSUPERUSER NOBYPASSRLS
        - CREATE ROLE ar_readonly LOGIN NOSUPERUSER NOBYPASSRLS
        - GRANT ar_platform TO ar_owner WITH ADMIN OPTION
        - GRANT ar_app TO ar_owner WITH ADMIN OPTION
        - GRANT ar_readonly TO ar_owner WITH ADMIN OPTION
      postInitApplicationSQL:
        # vector is not a trusted extension. The operator runs these as
        # superuser; ar_owner cannot create them later.
        - CREATE EXTENSION IF NOT EXISTS pgcrypto
        - CREATE EXTENSION IF NOT EXISTS citext
        - CREATE EXTENSION IF NOT EXISTS pg_trgm
        - CREATE EXTENSION IF NOT EXISTS vector
        - CREATE EXTENSION IF NOT EXISTS btree_gin
        - CREATE DATABASE temporal
        - CREATE DATABASE temporal_visibility
        - CREATE DATABASE langfuse
  managed:
    roles:
      # plans has FORCE ROW LEVEL SECURITY and no INSERT policy, and bootstrap
      # inserts system roles with a null tenant. BYPASSRLS is that write.
      # CREATEDB creates the extra databases above. CREATEROLE is not SUPERUSER.
      - name: ar_owner
        ensure: present
        login: true
        superuser: false
        createdb: true
        createrole: true
        bypassrls: true
        # The reconciler revokes memberships that are not listed here, including
        # a GRANT from postInitSQL. PostgreSQL 16 requires ADMIN OPTION, which
        # this list grants, before ar_owner can set the other passwords.
        inRoles:
          - ar_app
          - ar_platform
          - ar_readonly
        passwordSecret:
          name: {{ include "ar.roleSecret" (list . "ar_owner") }}
      # platform_session runs before a tenant is known.
      - name: ar_platform
        ensure: present
        login: true
        superuser: false
        bypassrls: true
        passwordSecret:
          name: {{ include "ar.roleSecret" (list . "ar_platform") }}
      - name: ar_app
        ensure: present
        login: true
        superuser: false
        bypassrls: false
        passwordSecret:
          name: {{ include "ar.roleSecret" (list . "ar_app") }}
      - name: ar_readonly
        ensure: present
        login: true
        superuser: false
        bypassrls: false
        passwordSecret:
          name: {{ include "ar.roleSecret" (list . "ar_readonly") }}
  storage:
    size: {{ .Values.postgres.storage }}
  {{- if .Values.backup.enabled }}
  backup:
    retentionPolicy: {{ .Values.backup.retention | quote }}
    barmanObjectStore:
      destinationPath: {{ printf "s3://%s/postgres" .Values.backup.s3.bucket }}
      endpointURL: {{ .Values.backup.s3.endpoint }}
      s3Credentials:
        accessKeyId:
          name: {{ .Release.Name }}-backup
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: {{ .Release.Name }}-backup
          key: ACCESS_SECRET_KEY
      wal:
        compression: gzip
        maxParallel: 1
      data:
        compression: gzip
  {{- end }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: {{ .Release.Name }}-pg-pooler
spec:
  cluster:
    name: {{ .Release.Name }}-pg
  instances: 2
  type: rw
  pgbouncer:
    poolMode: transaction
{{- end }}
{{- if and .Values.postgres.bundled (eq .Values.postgres.mode "statefulset") }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  serviceName: {{ .Release.Name }}-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: {{ include "ar.thirdPartyImage" (list . .Values.postgres.image.repository .Values.postgres.image.tag) }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-pg-superuser
                  key: password
            - name: POSTGRES_DB
              value: ar
            - name: AR_DB_OWNER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ar.installSecret" . }}
                  key: AR_DB_OWNER_PASSWORD
            - name: AR_DB_PLATFORM_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ar.installSecret" . }}
                  key: AR_DB_PLATFORM_PASSWORD
            - name: AR_DB_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ar.installSecret" . }}
                  key: AR_DB_APP_PASSWORD
            - name: AR_DB_READONLY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ar.installSecret" . }}
                  key: AR_DB_READONLY_PASSWORD
          readinessProbe:
            tcpSocket:
              port: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: init
              mountPath: /docker-entrypoint-initdb.d/01-roles.sh
              subPath: 01-roles.sh
      volumes:
        - name: init
          configMap:
            name: {{ .Release.Name }}-postgres-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-postgres-init
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  01-roles.sh: |
{{ .Files.Get "files/init-roles.sh" | indent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-postgres
spec:
  selector:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
{{- end }}
