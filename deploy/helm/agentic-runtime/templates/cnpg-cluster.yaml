{{- if .Values.postgres.bundled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-pg-credentials
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
type: kubernetes.io/basic-auth
stringData:
  username: {{ .Values.postgres.username | quote }}
  password: {{ .Values.postgres.password | quote }}
{{- end }}
{{- if and .Values.postgres.bundled (eq .Values.postgres.mode "cnpg") }}
{{- range $role := list "ar_owner" "ar_platform" "ar_readonly" }}
---
{{- $secretName := printf "%s-db-role-%s" $.Release.Name ($role | replace "_" "-") }}
{{- $found := lookup "v1" "Secret" $.Release.Namespace $secretName }}
{{- $password := "" }}
{{- if and $found $found.data (index $found.data "password") }}
{{- $password = index $found.data "password" | b64dec }}
{{- else }}
{{- $password = randAlphaNum 32 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: {{ $.Release.Name }}
    cnpg.io/reload: "true"
type: kubernetes.io/basic-auth
stringData:
  username: {{ $role }}
  password: {{ $password }}
{{- end }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Release.Name }}-pg
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  instances: {{ .Values.postgres.instances }}
  imageName: {{ include "ar.thirdPartyImage" (list . .Values.postgres.image.repository .Values.postgres.image.tag) }}
  enableSuperuserAccess: true
  postgresql:
    parameters:
      archive_timeout: "300"
      shared_buffers: "256MB"
    extensions:
      - name: pgvector
        image:
          reference: {{ .Values.postgres.pgvectorImage | quote }}
  bootstrap:
    initdb:
      database: ar
      owner: ar_owner
      secret:
        name: {{ .Release.Name }}-db-role-ar-owner
      postInitApplicationSQL:
        - CREATE DATABASE temporal
        - CREATE DATABASE temporal_visibility
        - CREATE DATABASE langfuse
  storage:
    size: {{ .Values.postgres.storage }}
  managed:
    roles:
      # Migrations run as the database owner. CREATEROLE covers role grants in
      # revisions. It is not a superuser. FORCE ROW LEVEL SECURITY is on every
      # tenant table, and plans has no INSERT policy, so the owner is not
      # exempt. BYPASSRLS is what lets bootstrap write those catalogue rows.
      - name: ar_owner
        ensure: present
        login: true
        superuser: false
        createdb: true
        createrole: true
        bypassrls: true
        passwordSecret:
          name: {{ .Release.Name }}-db-role-ar-owner
      # Platform sessions open before a tenant is known, so they must bypass RLS.
      - name: ar_platform
        ensure: present
        login: true
        superuser: false
        bypassrls: true
        passwordSecret:
          name: {{ .Release.Name }}-db-role-ar-platform
      - name: ar_app
        ensure: present
        login: true
        superuser: false
        bypassrls: false
        passwordSecret:
          name: {{ .Release.Name }}-pg-credentials
      - name: ar_readonly
        ensure: present
        login: true
        superuser: false
        bypassrls: false
        passwordSecret:
          name: {{ .Release.Name }}-db-role-ar-readonly
  {{- if .Values.backup.enabled }}
  backup:
    retentionPolicy: {{ .Values.backup.retention | quote }}
    barmanObjectStore:
      destinationPath: {{ printf "s3://%s/postgres" .Values.backup.s3.bucket }}
      endpointURL: {{ .Values.backup.s3.endpoint }}
      s3Credentials:
        accessKeyId:
          name: {{ .Release.Name }}-backup
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: {{ .Release.Name }}-backup
          key: ACCESS_SECRET_KEY
      wal:
        compression: gzip
        maxParallel: 1
      data:
        compression: gzip
  {{- end }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: {{ .Release.Name }}-pg-pooler
spec:
  cluster:
    name: {{ .Release.Name }}-pg
  instances: 2
  type: rw
  pgbouncer:
    poolMode: transaction
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: {{ .Release.Name }}-db-ar
spec:
  name: ar
  owner: ar_owner
  cluster:
    name: {{ .Release.Name }}-pg
  extensions:
    - name: vector
    - name: pgcrypto
    - name: citext
    - name: pg_trgm
    - name: btree_gin
{{- end }}
{{- if and .Values.postgres.bundled (eq .Values.postgres.mode "statefulset") }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  serviceName: {{ .Release.Name }}-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: {{ include "ar.thirdPartyImage" (list . .Values.postgres.standaloneImage.repository .Values.postgres.standaloneImage.tag) }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgres.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-pg-credentials
                  key: password
            - name: POSTGRES_DB
              value: ar
          readinessProbe:
            tcpSocket:
              port: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: init
              mountPath: /docker-entrypoint-initdb.d/01-roles.sql
              subPath: 01-roles.sql
      volumes:
        - name: init
          configMap:
            name: {{ .Release.Name }}-postgres-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-postgres-init
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  01-roles.sql: |
{{ include "ar.postgresRolesSql" . | indent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-postgres
spec:
  selector:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
{{- end }}
