{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-default-deny
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-allow-dns
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-allow-app
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: NotIn
        values:
          - api
          - runtime-worker
          - mcp-gateway
          - sandbox-manager
          {{- if .Values.airgap.isolatePlatformDb }}
          - system-worker
          - ingest-worker
          {{- end }}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector: {}
  egress:
    {{- if .Values.airgap.isolatePlatformDb }}
    - to:
        - podSelector:
            matchExpressions:
              - key: cnpg.io/podRole
                operator: NotIn
                values: ["instance", "pooler"]
              - key: app.kubernetes.io/name
                operator: NotIn
                values: ["postgres"]
    {{- else }}
    - to:
        - podSelector: {}
    {{- end }}
    {{- if not .Values.airgap.lockdown }}
    - ports:
        - port: 443
          protocol: TCP
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: api
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: web
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: channels
        - namespaceSelector: {}
      ports:
        - port: 8000
          protocol: TCP
  egress:
    {{- if .Values.airgap.isolatePlatformDb }}
    {{- include "ar.platformDbEgress" . | nindent 4 }}
    {{- include "ar.tenantDbEgress" . | nindent 4 }}
    - to:
        - podSelector: {}
      ports:
        - {port: 6379, protocol: TCP}
        - {port: 7233, protocol: TCP}
        - {port: 8001, protocol: TCP}
        - {port: 8003, protocol: TCP}
        - {port: 8181, protocol: TCP}
        - {port: 8002, protocol: TCP}
        - {port: 8200, protocol: TCP}
        - {port: 8333, protocol: TCP}
        - {port: 4317, protocol: TCP}
    {{- else }}
    - to:
        - podSelector: {}
      ports:
        - {port: 5432, protocol: TCP}
        - {port: 6379, protocol: TCP}
        - {port: 7233, protocol: TCP}
        - {port: 8001, protocol: TCP}
        - {port: 8002, protocol: TCP}
        - {port: 8003, protocol: TCP}
        - {port: 8181, protocol: TCP}
        - {port: 8200, protocol: TCP}
        - {port: 8333, protocol: TCP}
        - {port: 4317, protocol: TCP}
    {{- end }}
    - ports:
        - {port: 4317, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-runtime-worker
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: runtime-worker
  policyTypes: ["Ingress", "Egress"]
  egress:
    {{- if .Values.airgap.isolatePlatformDb }}
    {{- include "ar.platformDbEgress" . | nindent 4 }}
    {{- include "ar.tenantDbEgress" . | nindent 4 }}
    - to:
        - podSelector: {}
      ports:
        - {port: 6379, protocol: TCP}
        - {port: 7233, protocol: TCP}
        - {port: 8001, protocol: TCP}
        - {port: 8002, protocol: TCP}
        - {port: 8003, protocol: TCP}
        - {port: 8181, protocol: TCP}
        - {port: 8200, protocol: TCP}
        - {port: 8333, protocol: TCP}
        - {port: 4317, protocol: TCP}
    {{- else }}
    - to:
        - podSelector: {}
      ports:
        - {port: 5432, protocol: TCP}
        - {port: 6379, protocol: TCP}
        - {port: 7233, protocol: TCP}
        - {port: 8001, protocol: TCP}
        - {port: 8002, protocol: TCP}
        - {port: 8003, protocol: TCP}
        - {port: 8181, protocol: TCP}
        - {port: 8200, protocol: TCP}
        - {port: 8333, protocol: TCP}
        - {port: 4317, protocol: TCP}
    {{- end }}
    - ports:
        - {port: 4317, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-mcp-gateway
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mcp-gateway
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: runtime-worker
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: system-worker
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: api
      ports:
        - port: 8002
          protocol: TCP
  egress:
    {{- if .Values.airgap.isolatePlatformDb }}
    {{- include "ar.platformDbEgress" . | nindent 4 }}
    {{- include "ar.tenantDbEgress" . | nindent 4 }}
    - to:
        - podSelector: {}
      ports:
        - {port: 6379, protocol: TCP}
        - {port: 8003, protocol: TCP}
        - {port: 8010, protocol: TCP}
        - {port: 8011, protocol: TCP}
        - {port: 8181, protocol: TCP}
        - {port: 3128, protocol: TCP}
        - {port: 7233, protocol: TCP}
        - {port: 8001, protocol: TCP}
        - {port: 8200, protocol: TCP}
        - {port: 8333, protocol: TCP}
        - {port: 4317, protocol: TCP}
    {{- else }}
    - to:
        - podSelector: {}
      ports:
        - {port: 5432, protocol: TCP}
        - {port: 6379, protocol: TCP}
        - {port: 7233, protocol: TCP}
        - {port: 8001, protocol: TCP}
        - {port: 8003, protocol: TCP}
        - {port: 8010, protocol: TCP}
        - {port: 8011, protocol: TCP}
        - {port: 8181, protocol: TCP}
        - {port: 3128, protocol: TCP}
        - {port: 8200, protocol: TCP}
        - {port: 8333, protocol: TCP}
        - {port: 4317, protocol: TCP}
    {{- end }}
    - ports:
        - {port: 4317, protocol: TCP}
    - to:
        - namespaceSelector:
            matchLabels:
              ar.io/purpose: sandboxes
      ports:
        - {port: 8080, protocol: TCP}
    {{- if not .Values.airgap.lockdown }}
    - ports:
        - {port: 443, protocol: TCP}
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-sandbox-manager
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sandbox-manager
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mcp-gateway
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: api
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: runtime-worker
      ports:
        - port: 8003
          protocol: TCP
  egress:
    {{- if .Values.airgap.isolatePlatformDb }}
    {{- include "ar.platformDbEgress" . | nindent 4 }}
    - to:
        - podSelector: {}
      ports:
        - {port: 6379, protocol: TCP}
        - {port: 6443, protocol: TCP}
        - {port: 443, protocol: TCP}
        - {port: 8200, protocol: TCP}
        - {port: 4317, protocol: TCP}
    {{- else }}
    - to:
        - podSelector: {}
      ports:
        - {port: 5432, protocol: TCP}
        - {port: 6379, protocol: TCP}
        - {port: 6443, protocol: TCP}
        - {port: 443, protocol: TCP}
        - {port: 8200, protocol: TCP}
        - {port: 4317, protocol: TCP}
    {{- end }}
    - ports:
        - {port: 4317, protocol: TCP}
    - to:
        - namespaceSelector:
            matchLabels:
              ar.io/purpose: sandboxes
      ports:
        - {port: 8080, protocol: TCP}
{{- if .Values.airgap.isolatePlatformDb }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-system-worker
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: system-worker
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector: {}
  egress:
    {{- include "ar.platformDbEgress" . | nindent 4 }}
    - to:
        - podSelector:
            matchExpressions:
              - key: cnpg.io/podRole
                operator: NotIn
                values: ["instance", "pooler"]
    - ports:
        - {port: 4317, protocol: TCP}
    {{- if not .Values.airgap.lockdown }}
    - ports:
        - {port: 443, protocol: TCP}
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-ingest-worker
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ingest-worker
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector: {}
  egress:
    {{- include "ar.platformDbEgress" . | nindent 4 }}
    - to:
        - podSelector:
            matchExpressions:
              - key: cnpg.io/podRole
                operator: NotIn
                values: ["instance", "pooler"]
    - ports:
        - {port: 4317, protocol: TCP}
    {{- if not .Values.airgap.lockdown }}
    - ports:
        - {port: 443, protocol: TCP}
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-platform-clients
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: ["temporal", "migrate", "bootstrap"]
  policyTypes: ["Egress"]
  egress:
    {{- include "ar.platformDbEgress" . | nindent 4 }}
{{- end }}
{{- if and .Values.postgres.bundled (eq .Values.postgres.mode "cnpg") }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-cnpg-api
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: {{ .Release.Name }}-pg
  policyTypes: ["Egress"]
  egress:
    # initdb Jobs have cnpg.io/jobRole, not podRole=instance, and they dial the API service IP.
    - ports:
        - {port: 443, protocol: TCP}
        - {port: 6443, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-cnpg-instance
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: {{ .Release.Name }}-pg
      cnpg.io/podRole: instance
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: {{ .Release.Name }}-pg
              cnpg.io/podRole: pooler
      ports:
        - {port: 5432, protocol: TCP}
    - from:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: {{ .Release.Name }}-pg
              cnpg.io/podRole: instance
      ports:
        - {port: 5432, protocol: TCP}
        - {port: 8000, protocol: TCP}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - {port: 8000, protocol: TCP}
        - {port: 5432, protocol: TCP}
  egress:
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: {{ .Release.Name }}-pg
              cnpg.io/podRole: instance
      ports:
        - {port: 5432, protocol: TCP}
        - {port: 8000, protocol: TCP}
    # The API server is a node endpoint, not a pod, so a namespace selector misses it.
    - ports:
        - {port: 443, protocol: TCP}
        - {port: 6443, protocol: TCP}
    - to:
        - podSelector: {}
      ports:
        - {port: 8333, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-cnpg-pooler
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: {{ .Release.Name }}-pg
      cnpg.io/podRole: pooler
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: {{ .Release.Name }}-pg
              cnpg.io/podRole: instance
      ports:
        - {port: 5432, protocol: TCP}
{{- end }}
{{- if and (not .Values.postgres.bundled) (.Values.postgres.externalCidrs) }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-external-db
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - api
          - runtime-worker
          - mcp-gateway
          - sandbox-manager
          - system-worker
          - ingest-worker
          - temporal
          - migrate
          - bootstrap
  policyTypes: ["Egress"]
  egress:
    {{- include "ar.externalDbEgress" . | nindent 4 }}
{{- end }}
{{- if .Values.airgap.lockdown }}
{{- if .Values.airgap.egressCIDRs }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-airgap-cidrs
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: ["api", "runtime-worker", "mcp-gateway"]
  policyTypes: ["Egress"]
  egress:
    {{- $ports := .Values.airgap.egressPorts | default (list 443 80) }}
    {{- $opensDb := include "ar.egressOpensDatabase" . | trim }}
    {{- if and (eq $opensDb "yes") (not .Values.cluster.podCIDR) }}
    {{- fail "airgap.egressPorts includes a database port but cluster.podCIDR is empty, so those CIDRs would reopen platform database pods. Set cluster.podCIDR or remove the database ports from airgap.egressPorts." }}
    {{- end }}
    {{- range .Values.airgap.egressCIDRs }}
    - to:
        - ipBlock:
            cidr: {{ . | quote }}
            {{- if eq $opensDb "yes" }}
            {{- $except := include "ar.exceptLines" (list . $) }}
            {{- if $except }}
            except:
              {{- $except | nindent 14 }}
            {{- end }}
            {{- end }}
      ports:
        {{- range $ports }}
        - {port: {{ . }}, protocol: TCP}
        {{- end }}
    {{- end }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-airgap-squid
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: squid
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
{{- end }}
{{- end }}
