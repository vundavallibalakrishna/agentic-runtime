{{- if .Values.objectStorage.bundled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-seaweedfs
  labels:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  serviceName: {{ .Release.Name }}-seaweedfs
  replicas: {{ ternary 3 1 (eq .Values.objectStorage.mode "ha") }}
  selector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seaweedfs
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        seaweedfs.com/versioning: "true"
        seaweedfs.com/object-lock: "true"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seaweedfs
          image: {{ include "ar.thirdPartyImage" (list . .Values.objectStorage.image.repository .Values.objectStorage.image.tag) }}
          args: ["server", "-dir=/data", "-s3", "-s3.port=8333"]
          ports:
            - containerPort: 8333
          readinessProbe:
            tcpSocket:
              port: 8333
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-seaweedfs
spec:
  selector:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: s3
      port: 8333
      targetPort: 8333
{{- end }}
