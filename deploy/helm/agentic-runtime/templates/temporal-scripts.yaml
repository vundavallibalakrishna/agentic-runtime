{{- if .Values.temporal.bundled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-temporal-scripts
  labels:
    app.kubernetes.io/name: temporal
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  schema.sh: |
    #!/bin/sh
    # Idempotent schema setup. The password stays in SQL_PASSWORD.
    set -eu
    export SQL_PASSWORD="${POSTGRES_PWD}"
    export SQL_PLUGIN=postgres12
    export SQL_HOST="${POSTGRES_SEEDS}"
    export SQL_PORT="${DB_PORT}"
    export SQL_USER="${POSTGRES_USER}"
    apply() {
      db="$1"
      dir="$2"
      err="/tmp/temporal-schema.err"
      n=0
      while [ "$n" -lt 60 ]; do
        if temporal-sql-tool --db "$db" setup-schema -v 0.0 >"$err" 2>&1 \
          || grep -q "already exists" "$err"; then
          if temporal-sql-tool --db "$db" update-schema -d "$dir" >"$err" 2>&1; then
            rm -f "$err"
            return 0
          fi
        fi
        rm -f "$err"
        n=$((n + 1))
        sleep 2
      done
      echo "temporal schema update failed for ${db}" >&2
      exit 1
    }
    apply temporal /etc/temporal/schema/postgresql/v12/temporal/versioned
    apply temporal_visibility /etc/temporal/schema/postgresql/v12/visibility/versioned
  start.sh: |
    #!/bin/bash
    # One process runs every Temporal service. Cluster metadata stays on
    # 127.0.0.1, which is correct for that process.
    set -eu
    export BIND_ON_IP=0.0.0.0
    export TEMPORAL_BROADCAST_ADDRESS="$(getent hosts "$(hostname)" | awk '{print $1; exit}')"
    export TEMPORAL_CLI_ADDRESS="${TEMPORAL_ADDRESS}"
    dockerize -template /etc/temporal/config/config_template.yaml:/etc/temporal/config/docker.yaml
    /etc/temporal/start-temporal.sh &
    child=$!
    trap 'kill "$child" 2>/dev/null || true' TERM INT
    ready=0
    for _ in $(seq 1 90); do
      if temporal --address 127.0.0.1:7233 operator cluster health 2>/dev/null | grep -q SERVING; then
        ready=1
        break
      fi
      if ! kill -0 "$child" 2>/dev/null; then
        wait "$child"
        exit $?
      fi
      sleep 2
    done
    if [ "$ready" -ne 1 ]; then
      echo "temporal did not serve" >&2
      exit 1
    fi
    ns="${TEMPORAL_NAMESPACE}"
    if ! temporal --address 127.0.0.1:7233 operator namespace describe --namespace "$ns" >/dev/null 2>&1; then
      temporal --address 127.0.0.1:7233 operator namespace create --namespace "$ns" --retention 72h
    fi
    wait "$child"
{{- end }}
