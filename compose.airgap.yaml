# Air-gap override. The app network has no route to the internet. Squid is the
# only process on the external network. Model calls from api, the model gateway
# and the runtime worker go through that proxy. Hosts they may open are the
# lines in deploy/compose/squid/allowlist.txt. Sandboxes stay on the internal
# sandbox network and use the same proxy with their own token.
networks:
  app:
    internal: true
  egress: {}

services:
  squid:
    networks: [app, sandbox, egress]
  api:
    environment:
      HTTP_PROXY: http://squid:3128
      HTTPS_PROXY: http://squid:3128
      NO_PROXY: localhost,127.0.0.1,postgres,valkey,temporal,sandbox-manager,model-gateway,mcp-gateway,api,web,squid,seaweedfs,openbao,opa
  model-gateway:
    environment:
      HTTP_PROXY: http://squid:3128
      HTTPS_PROXY: http://squid:3128
      NO_PROXY: localhost,127.0.0.1,postgres,valkey,temporal,sandbox-manager,model-gateway,mcp-gateway,api,web,squid,seaweedfs,openbao,opa
  runtime-worker:
    environment:
      HTTP_PROXY: http://squid:3128
      HTTPS_PROXY: http://squid:3128
      NO_PROXY: localhost,127.0.0.1,postgres,valkey,temporal,sandbox-manager,model-gateway,mcp-gateway,api,web,squid,seaweedfs,openbao,opa
