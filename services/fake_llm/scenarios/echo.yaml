- match:
    system_contains: "sentence case"
    contains: "brief"
  respond:
    text: "One-page brief. The name stays in sentence case."
- match:
    system_contains: "bullet points"
    contains: "status"
  respond:
    text: "- Platform work is on track.\n- I kept this in bullet points because you asked me to."
- match: {contains: "slow"}
  respond:
    text: "This answer is intentionally slow so you can press stop."
    delay_ms: 400
    tokens_per_chunk: 2
